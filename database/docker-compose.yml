version: '3.8'

# =========================================================================
# TAKINMART — AAPANEL DOCKER COMPOSE CONFIGURATION
# =========================================================================
# To run on aaPanel:
# 1. Open aaPanel -> Docker -> Compose Template (or run via SSH terminal)
# 2. docker compose up -d
# 3. PostgreSQL is available at port 5432
# =========================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: takinmart_postgres
    restart: always
    environment:
      POSTGRES_USER: takin_admin
      POSTGRES_PASSWORD: takin_secure_password_2026
      POSTGRES_DB: takinmart_db
    ports:
      - "5432:5432"
    volumes:
      - takinmart_pgdata:/var/lib/postgresql/data
      - ./aapanel-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takin_admin -d takinmart_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  takinmart_pgdata:
    driver: local
